[project]
name = "da-prb"
version = "0.1.0"
description = "Dissent Ablation on SWE-PRBench — empirical test of the code_crew pattern"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0.0",
  "anthropic>=0.40.0",
  "openai>=1.50.0",
  "pydantic>=2.0",
  "tenacity>=8.0",
  "click>=8.1",
  "tqdm>=4.66",
  "tiktoken>=0.7",
  "scipy>=1.13",
  "numpy>=1.26",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.4",
]
