name: Validate release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate synchronized release surfaces
        run: uv run --with pyyaml python scripts/validate_release.py
      - name: Validate Agent Skills package
        run: uvx --from skills-ref agentskills validate plugins/code-crew/skills/code-crew
