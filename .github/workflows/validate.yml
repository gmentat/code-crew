name: Validate release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Validate synchronized release surfaces
        run: uv run --with pyyaml==6.0.3 python scripts/validate_release.py
      - name: Validate Agent Skills package
        run: uvx --from skills-ref==0.1.1 agentskills validate plugins/code-crew/skills/code-crew
